services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: aiders
      POSTGRES_USER: aiders
      POSTGRES_PASSWORD: aiders_dev
    ports:
      - "5432:5432"
    volumes:
      - aiders_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  aiders_pg:
